
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Club</title>
    <meta name="description" content="Stack Club — gestão de clubes de poker: ranking, poker clock, financeiro e bar." />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/marca.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /*
       * Identidade Stack Club. As escalas abaixo substituem as do Tailwind, então
       * as classes já espalhadas pelo app mudam juntas:
       * - gray: neutro frio e limpo (fundos, cartões, bordas e textos).
       * - emerald, cyan, violet: o ouro da marca. Antes eram três cores de
       *   destaque competindo (geral, clock, bar); agora a marca tem uma só.
       * Verde e vermelho de estado (pago, erro) usam green e red; pendente, amber.
       */
      (function () {
        var ouro = {
          50: '#fbf8ef', 100: '#f5edd6', 200: '#eadaa9', 300: '#dfc47c', 400: '#d5b366',
          500: '#c9a354', 600: '#b48d3f', 700: '#8f6f32', 800: '#6b5327', 900: '#45361b', 950: '#271e0f'
        };
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
              colors: {
                gray: {
                  50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 400: '#a1a1aa',
                  500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b'
                },
                emerald: ouro, cyan: ouro, violet: ouro,
                // Verde de estado (pago, ativo, recebido): o verde antigo do app.
                green: {
                  50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399',
                  500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22'
                },
                ouro: ouro,
              },
            },
          },
        };
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #09090b;
        color: #fafafa;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'cv11', 'ss01';
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.14);
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.28);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Remover setas de inputs numéricos */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
